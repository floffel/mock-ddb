[package]
name = "mock-ddb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mock-ddb]
path = ".."
default-features = false

[[bin]]
name = "parse_expression"
path = "fuzz_targets/parse_expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "random_items"
path = "fuzz_targets/random_items.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
