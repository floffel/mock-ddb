[package]
name = "mock-ddb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mock-ddb]
path = ".."
default-features = false

[[bin]]
name = "parse_expression"
path = "fuzz_targets/parse_expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "random_items"
path = "fuzz_targets/random_items.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_partiql"
path = "fuzz_targets/parse_partiql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "update_apply"
path = "fuzz_targets/update_apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "item_document"
path = "fuzz_targets/item_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "number_literal"
path = "fuzz_targets/number_literal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "value_validation"
path = "fuzz_targets/value_validation.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
